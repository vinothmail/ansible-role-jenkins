---
- name: Install Java and prerequisites
  ansible.builtin.apt:
    name:
      - "{{ jenkins_java_package }}"
      - ca-certificates
      - curl
    state: present
    update_cache: yes

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Jenkins signing key
  ansible.builtin.get_url:
    url: "{{ jenkins_key_url }}"
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Add Jenkins apt repository
  ansible.builtin.apt_repository:
    repo: "{{ jenkins_repo }}"
    filename: jenkins
    state: present
    update_cache: yes

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present

- name: Ensure Jenkins is running and enabled
  ansible.builtin.service:
    name: "{{ jenkins_service }}"
    state: started
    enabled: yes

- name: Wait for Jenkins to listen on port 8080
  ansible.builtin.wait_for:
    port: 8080
    delay: 10
    timeout: 120
